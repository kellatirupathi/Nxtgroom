# Nginx site for the FacultyTrack API on Lightsail.
#
# setup-server.sh installs this as /etc/nginx/sites-available/facultytrack-api
# and replaces api.example.com with the real API hostname.
#
# Traffic: internet -> Nginx (HTTPS, this file) -> 127.0.0.1:8000 (container).
# Exactly one proxy sits in front of Node, which is why TRUST_PROXY_HOPS=1.

# Report, password-reset and invitation links carry a credential in the path.
# The API already redacts them from its own log; this keeps them out of the
# Nginx access log too.
map $request_uri $facultytrack_log_uri {
    "~^(?<head>/api/v2/reports/)(?!cron(?:[/?]|$))[^/?]+(?<tail>.*)$"   "${head}<token>${tail}";
    "~^(?<head>/api/v2/auth/reset-password/)[^/?]+(?<tail>.*)$"         "${head}<token>${tail}";
    default                                                             $request_uri;
}

log_format facultytrack '$remote_addr [$time_local] "$request_method $facultytrack_log_uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

# Requests addressed to the bare IP or an unknown hostname are dropped, so
# scanners never reach the API.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Let's Encrypt HTTP-01 challenge (certificate issue and renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" rather than "http2 on": Ubuntu 24.04 ships Nginx 1.24,
    # which predates the newer directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:facultytrack_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/facultytrack-api.access.log facultytrack;
    error_log  /var/log/nginx/facultytrack-api.error.log warn;

    # Attendance photographs are up to 8 MB (multer limit in the API). The
    # Nginx default of 1 MB would reject every check-in with 413.
    client_max_body_size 10m;
    # Nginx receives the whole upload before contacting Node, so a slow campus
    # connection does not hold one of the API's ten photo-processing slots.
    proxy_request_buffering on;

    # The API sends uncompressed JSON, and Ubuntu's nginx.conf compresses only
    # text/html. The dashboard's instructor list (~400 KB) and a month of
    # attendance (~300 KB) shrink to roughly a tenth. Replies under 1 KB, such
    # as the login response carrying the token, are left alone.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwritten, never appended: a client-supplied X-Forwarded-For would
        # otherwise let anyone choose the address the rate limiters see.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        # The API allows 60 s per request (HTTP_REQUEST_TIMEOUT_MS); keep the
        # proxy slightly longer so the API's own timeout answers first.
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
